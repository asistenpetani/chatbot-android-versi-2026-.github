name: Release App ASPEK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_and_publish:
    name: 📱 Build AAB & Publish Play Store
    runs-on: ubuntu-latest
    steps:
      # 1. Ambil kode sumber dari repositori
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      # 2. Siapkan Java Development Kit (JDK) untuk Kotlin
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Optimasi Cache Gradle (Potongan Kode Anda)
      - name: 🐘 Setup Gradle com.asistenpetani
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          # Mengaktifkan cache build secara otomatis untuk cabang non-main
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 4. Eksekusi Build AAB
      - name: 🔨 Build Release AAB
        run: ./gradlew :app:bundleRelease
