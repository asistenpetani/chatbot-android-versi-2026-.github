<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tidak Ditemukan - ASPEK</title>
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --secondary: #40916c;
            --accent: #d8f3dc;
            --text: #2d3142;
            --background: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background-color: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-top: 8px solid var(--secondary);
        }
        h1 {
            font-size: 5rem;
            color: var(--primary);
            margin: 0;
            font-weight: 800;
            line-height: 1;
        }
        h2 {
            font-size: 1.8rem;
            color: var(--text);
            margin: 15px 0 25px 0;
        }
        p {
            font-size: 1.05rem;
            color: #5c5f75;
            margin-bottom: 35px;
        }
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: var(--primary-light);
            transform: scale(1.02);
        }
        .links {
            margin-top: 30px;
            font-size: 0.9rem;
        }
        .links a {
            color: var(--secondary);
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Halaman Tidak Ditemukan</h2>
        <p>Maaf, halaman yang Anda cari tidak dapat ditemukan atau telah dipindahkan. Silakan gunakan tombol di bawah ini untuk kembali ke beranda.</p>
        <a href="/" class="btn">Kembali ke Beranda</a>
        
        <div class="links">
            <a href="/privacy">Kebijakan Privasi</a> | 
            <a href="/">Beranda ASPEK</a>
        </div>
    </div>

</body>
</html>
